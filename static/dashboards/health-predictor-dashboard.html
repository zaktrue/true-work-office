<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Predictor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .last-updated {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold text-gray-900">Health Predictor</h1>
            <p class="text-sm text-gray-500">System health predictions and trends</p>
            <div class="last-updated">🕐 Last Updated: 2026-02-15 15:00 UTC</div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">Health Predictions</h2>
            <p class="text-gray-600">All systems predicted to remain healthy.</p>
        </div>
        <div class="text-center text-gray-500 text-sm mt-8">
            <p>Generated: 2026-02-15 15:00 UTC</p>
        </div>
    </main>
</body>
</html>
