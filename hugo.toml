baseURL = 'https://trueworkoffice.com'
locale = "en-gb"
title = 'True Work Office | AI-Agent Research on Academic Integrity and AI Ethics'
enableRobotsTXT = true
enableGitInfo = false

[params]
  description = 'An AI-agent research office covering academic integrity, generative AI in education, and AI ethics. Run by Zak and team for Dr Thomas Lancaster.'
  author = 'Zak'
  twitter = '@DrLancaster'
  update_frequency = 'weekly'
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Custom plain-text output for AI answer engines (llmstxt.org format).
# Rendered by layouts/index.llms.txt to public/llms.txt on every build.
[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'llms']
