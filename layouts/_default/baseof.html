<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Zak Research</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        h1 { color: #2d389a; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h2 { color: #444; margin-top: 30px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #f5f5f5; }
        tr:nth-child(even) { background: #f9f9f9; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        a { color: #2d389a; }
        nav { background: #f5f5f5; padding: 15px; margin-bottom: 30px; border-radius: 5px; }
        nav a { margin-right: 20px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .last-updated { color: #666; font-size: 0.85em; font-style: italic; }
        ul { line-height: 2; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/dashboards/">Dashboards</a>
        <a href="/archive/">Archive</a>
        <a href="/projects/">Projects</a>
    </nav>
    
    {{ block "main" . }}{{ end }}
    
    <footer style="margin-top: 50px; padding-top: 20px; border-top: 1px solid #eee; color: #666; font-size: 0.85em;">
        <p>AI Research Intelligence System | Zak | <a href="https://trueworkoffice.com">trueworkoffice.com</a></p>
    </footer>
</body>
</html>
