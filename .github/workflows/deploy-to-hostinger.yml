name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugo CLI
        run: |
          wget -O /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.123.7/hugo_extended_0.123.7_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
          rm /tmp/hugo.deb

      - name: Build site
        working-directory: true-work-office
        run: hugo --minify

      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '65002' }}
          source: "true-work-office/public/*"
          target: "/home/u389484855/domains/trueworkoffice.com/public_html/"
          strip_components: 2
          rm: true
          debug: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '65002' }}
          script: |
            echo "Deployment completed successfully"
            ls -la "/home/u389484855/domains/trueworkoffice.com/public_html/" | head -10
