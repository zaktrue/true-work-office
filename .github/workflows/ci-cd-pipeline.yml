name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Runs queue rather than overlap on main, so a deploy never gets skipped
# because a later push cancelled it mid-rsync (2026-07-09 CI fix).
concurrency:
  group: ci-cd-pipeline-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate JSON files
        run: |
          find . -name "*.json" -type f ! -path "./.git/*" ! -path "*/node_modules/*" -exec python3 -c "import json; json.load(open('{}'))" \; 2>&1 | head -20
          echo "✅ JSON validation complete"
      
      - name: Validate YAML files
        run: |
          find . -name "*.yml" -o -name "*.yaml" | grep -v node_modules | head -20 | while read f; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null || echo "⚠️  $f"
          done
          echo "✅ YAML validation complete"

  build-hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.164.0"  # pinned 2026-07-08: reproducible builds; was latest (unpinned). Bump deliberately with a local test build.
          extended: true
      
      - name: Build Hugo Site
        run: |
          hugo --minify --gc
          echo "✅ Hugo build complete"
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-site
          path: public/
          retention-days: 1

  deploy:
    needs: [validate, build-hugo]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.164.0"  # pinned 2026-07-08: reproducible builds; was latest (unpinned). Bump deliberately with a local test build.
          extended: true
      
      - name: Build Hugo Site
        run: hugo --minify --gc
      
      - name: Deploy to Hostinger
        env:
          HOSTINGER_SERVER: ${{ secrets.HOSTINGER_SERVER }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          # Setup SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key with proper newlines (preserve \n from secret)
          echo "$HOSTINGER_SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add host to known hosts
          ssh-keyscan -p "${HOSTINGER_PORT:-65002}" "$HOSTINGER_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Test SSH connection first
          ssh -p "${HOSTINGER_PORT:-65002}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes "${HOSTINGER_SSH_USER}@${HOSTINGER_SERVER}" "echo 'SSH connection successful'" || echo "SSH test failed"
          
          # Deploy via rsync --delete (mirrors public/ exactly onto the remote
          # docroot, removing anything remote that Hugo no longer generates).
          #
          # Previously this used `scp -r public/*`, which only adds/overwrites
          # and never deletes - every page ever removed from the Hugo build
          # (static/private/, the old content/archive/research/ deep-research
          # pages, stale dashboards, etc.) stayed live on trueworkoffice.com
          # forever, because there was nothing to overwrite them. Found
          # 2026-07-06 when content/archive/research/* pages were removed
          # from the repo for a privacy fix but were still returning HTTP 200
          # on the live site days later. A one-off `rm -rf .../private` was
          # bolted on for the previous incident, but that doesn't scale -
          # every future removal would need its own hand-added rm. rsync
          # --delete fixes the whole class of bug generically.
          #
          # --exclude='/discord/' protects discord-proxy's manually-deployed
          # interactions.php (deployed by .github/workflows/deploy-discord-proxy.yml,
          # a separate workflow that only runs on discord-proxy/** changes) from
          # being deleted by this workflow, since that path isn't part of the
          # Hugo build output.
          #
          # --exclude='/secure/' protects the password-gated PRIVATE dashboard
          # (PHP gate + the owner's full/sensitive dashboards). Those files are
          # pushed straight from the ops server to Hostinger by
          # scripts/push_private_dashboard.sh (never via this public repo), so
          # they aren't in the Hugo build - without this exclude, rsync --delete
          # would wipe them on every public deploy. See
          # memory/2026-07-06-dashboard-privacy-split.md.
          # Retry up to 3 times with backoff (20s, then 40s) - Hostinger's end
          # intermittently drops the rsync/SSH connection (~9-16% of runs,
          # self-heals on the next scheduled push). This absorbs those
          # transients instead of failing the run and emailing the owner.
          # See memory/2026-07-09-ci-rsync-retry-fix.md.
          attempt=1
          until rsync -avz --delete \
            --exclude='/discord/' \
            --exclude='/secure/' \
            -e "ssh -p ${HOSTINGER_PORT:-65002} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
            public/ "${HOSTINGER_SSH_USER}@${HOSTINGER_SERVER}:/home/u389484855/domains/trueworkoffice.com/public_html/"
          do
            if [ "$attempt" -ge 3 ]; then
              echo "❌ rsync failed after 3 attempts"
              exit 1
            fi
            sleep_for=$((attempt * 20))
            echo "⚠️  rsync attempt $attempt failed, retrying in ${sleep_for}s..."
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

          echo "✅ Deployed to Hostinger"
