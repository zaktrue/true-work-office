name: Daily Health Checks

on:
  schedule:
    # Run at 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Repository Health
  # ─────────────────────────────────────────
  repo-health:
    name: 🏥 Repository Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository statistics
        run: |
          echo "## Repository Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count files by type
          echo "### File Counts" >> $GITHUB_STEP_SUMMARY
          echo "- Python files: $(find . -name '*.py' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript files: $(find . -name '*.js' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- JSON files: $(find . -name '*.json' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- YAML files: $(find . -name '*.yml' -o -name '*.yaml' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Markdown files: $(find . -name '*.md' | wc -l)" >> $GITHUB_STEP_SUMMARY
          
          # Repository size
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Repository Size" >> $GITHUB_STEP_SUMMARY
          du -sh . | awk '{print "- Total: " $1}' >> $GITHUB_STEP_SUMMARY
          du -sh .git | awk '{print "- Git history: " $1}' >> $GITHUB_STEP_SUMMARY

      - name: Check for stale branches
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Branch Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Total branches: $(git branch -r | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Recent commits (7 days): $(git log --oneline --since='7 days ago' | wc -l)" >> $GITHUB_STEP_SUMMARY

      - name: Check for large files
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Large Files (>1MB)" >> $GITHUB_STEP_SUMMARY
          large_files=$(find . -type f -size +1M ! -path './.git/*' ! -path './node_modules/*' 2>/dev/null | head -10)
          if [ -n "$large_files" ]; then
            echo "$large_files" | while read file; do
              size=$(du -h "$file" | cut -f1)
              echo "- $file ($size)" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "- No large files found" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────
  # JOB 2: Dependency Checks
  # ─────────────────────────────────────────
  dependency-check:
    name: 📦 Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Python dependencies
        run: |
          pip install safety pip-audit
          
          if [ -f requirements.txt ]; then
            echo "## Python Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Safety Check" >> $GITHUB_STEP_SUMMARY
            safety check -r requirements.txt --json || true
          else
            echo "No requirements.txt found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for outdated dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip list --outdated --format=columns 2>/dev/null | head -20 || true
          fi

  # ─────────────────────────────────────────
  # JOB 3: Skill System Health
  # ─────────────────────────────────────────
  skill-health:
    name: 🎯 Skill System Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate skill health report
        run: |
          python << 'EOF'
          import json
          import os
          from datetime import datetime
          
          skills_dir = 'skills'
          report = {
              'timestamp': datetime.utcnow().isoformat(),
              'total_skills': 0,
              'skills': []
          }
          
          if os.path.exists(skills_dir):
              for skill in os.listdir(skills_dir):
                  skill_path = os.path.join(skills_dir, skill)
                  if os.path.isdir(skill_path):
                      report['total_skills'] += 1
                      skill_info = {'name': skill}
                      
                      # Check origin.json
                      origin_file = os.path.join(skill_path, '.clawdhub', 'origin.json')
                      if os.path.exists(origin_file):
                          try:
                              with open(origin_file, 'r') as f:
                                  data = json.load(f)
                                  skill_info['metadata'] = data
                                  skill_info['has_origin'] = True
                          except:
                              skill_info['has_origin'] = False
                              skill_info['error'] = 'Invalid origin.json'
                      else:
                          skill_info['has_origin'] = False
                      
                      # Check for scripts
                      scripts_dir = os.path.join(skill_path, 'scripts')
                      skill_info['has_scripts'] = os.path.exists(scripts_dir)
                      
                      report['skills'].append(skill_info)
          
          # Save report
          os.makedirs('reports', exist_ok=True)
          with open('reports/skill-health.json', 'w') as f:
              json.dump(report, f, indent=2)
          
          print(f"Generated health report for {report['total_skills']} skills")
          EOF

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: skill-health-report
          path: reports/skill-health.json
          retention-days: 30

  # ─────────────────────────────────────────
  # JOB 4: Notification
  # ─────────────────────────────────────────
  notify:
    name: 📧 Send Health Report
    runs-on: ubuntu-latest
    needs: [repo-health, dependency-check, skill-health]
    if: always()
    steps:
      - name: Generate notification
        run: |
          echo "Daily health check completed at $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "Status: ${{ job.status }}"
