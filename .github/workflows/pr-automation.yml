name: Pull Request Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: PR Validation
  # ─────────────────────────────────────────
  validate:
    name: ✅ PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

      - name: Check file changes
        run: |
          echo "## Files Changed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          git diff --name-only origin/main...HEAD | head -20 | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

      - name: Check for sensitive files
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Check" >> $GITHUB_STEP_SUMMARY
          
          sensitive_patterns='\.env|\.key|\.pem|password|secret|token'
          changed_files=$(git diff --name-only origin/main...HEAD)
          
          violations=0
          for file in $changed_files; do
            if echo "$file" | grep -qiE "$sensitive_patterns"; then
              echo "⚠️  Potentially sensitive file: $file" >> $GITHUB_STEP_SUMMARY
              violations=$((violations + 1))
            fi
          done
          
          if [ $violations -eq 0 ]; then
            echo "✅ No sensitive files detected" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────
  # JOB 2: Size Labeler
  # ─────────────────────────────────────────
  size-label:
    name: 🏷️ Size Label
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate PR size
        id: size
        run: |
          additions=$(git diff --stat origin/main...HEAD | tail -1 | awk '{print $4}')
          deletions=$(git diff --stat origin/main...HEAD | tail -1 | awk '{print $6}')
          
          # Default if no changes detected
          additions=${additions:-0}
          deletions=${deletions:-0}
          
          total=$((additions + deletions))
          
          if [ $total -lt 50 ]; then
            label="size:XS"
          elif [ $total -lt 150 ]; then
            label="size:S"
          elif [ $total -lt 400 ]; then
            label="size:M"
          elif [ $total -lt 800 ]; then
            label="size:L"
          else
            label="size:XL"
          fi
          
          echo "label=$label" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT

      - name: Comment PR size
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ steps.size.outputs.label }}';
            const total = '${{ steps.size.outputs.total }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📊 **PR Size: ${label}** (${total} lines changed)`
            });

  # ─────────────────────────────────────────
  # JOB 3: Auto-assign Reviewers
  # ─────────────────────────────────────────
  auto-assign:
    name: 👥 Auto Assign
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Assign reviewers based on path
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Define code owners based on paths
            const codeOwners = {
              'monitoring/': ['@thomas'],
              'skills/': ['@zaktrue'],
              'true-work-office/': ['@zaktrue'],
              '.github/workflows/': ['@thomas']
            };
            
            const reviewers = new Set();
            
            for (const file of changedFiles.data) {
              for (const [path, owners] of Object.entries(codeOwners)) {
                if (file.filename.startsWith(path)) {
                  owners.forEach(owner => reviewers.add(owner.replace('@', '')));
                }
              }
            }
            
            if (reviewers.size > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: Array.from(reviewers)
              });
            }
